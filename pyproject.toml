[project]
name = "vision-transfer-learning"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "matplotlib", "scikit-learn", "pillow", "jupyterlab", "ipykernel"]

[project.optional-dependencies]
cpu = ["torch", "torchvision"]
cu128 = ["torch", "torchvision"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu128", extra = "cu128" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu128", extra = "cu128" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
